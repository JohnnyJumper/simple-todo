version: "3.9"
name: veritone-tech

services:
  backend:
    build:
      context: ./backend
    container_name: veritone-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    volumes:
      # persist sqlite db outside the container
      - backend_db:/app/prisma
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://localhost:3000"
    container_name: veritone-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - appnet

networks:
  appnet:

volumes:
  backend_db:
